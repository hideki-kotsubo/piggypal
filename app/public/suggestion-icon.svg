<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep foreground loop (upper-left arc to center) -->
    <linearGradient id="frontLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="45%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <!-- Warm back loop (center to bottom-right return) -->
    <linearGradient id="backLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="55%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <!-- Soft ambient canvas shadow -->
    <filter id="canvasGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1E1B18" flood-opacity="0.07" />
    </filter>
  </defs>

  <!-- 1. Warm Off-White / Oat Canvas -->
  <rect 
    x="32" 
    y="32" 
    width="448" 
    height="448" 
    rx="112" 
    fill="#F7F5F0" 
    stroke="#E7E3DA" 
    stroke-width="3"
    filter="url(#canvasGlow)"
  />

  <!-- 2. Underlying Back Curve (Outflow / Amber return) -->
  <path 
    d="M 256 256 
       C 310 320, 396 320, 396 256 
       C 396 192, 320 192, 256 256" 
    fill="none" 
    stroke="url(#backLoop)" 
    stroke-width="48" 
    stroke-linecap="round"
  />

  <!-- 3. Overlapping Front Curve (Inflow / Teal surge crossing in front) -->
  <path 
    d="M 256 256 
       C 192 192, 116 192, 116 256 
       C 116 320, 202 320, 256 256" 
    fill="none" 
    stroke="url(#frontLoop)" 
    stroke-width="48" 
    stroke-linecap="round"
  />

  <!-- 4. Subtle Intersect Depth Cut -->
  <!-- A clean negative-space separator where the two currents cross -->
  <circle 
    cx="256" 
    cy="256" 
    r="8" 
    fill="#F7F5F0" 
  />
</svg>
