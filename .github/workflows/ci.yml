name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # docs/63 — fail if the lockfile lost another platform's native binaries.
      - run: node scripts/lockfile-platforms.mjs --check
      - run: npm ci
      - run: npm run lint -w app
      - run: npm run build -w app
      - run: npm run test -w app
      # docs/59 — website/changelog.html must match app/CHANGELOG.md.
      - run: npm run changelog -- --check

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w api
